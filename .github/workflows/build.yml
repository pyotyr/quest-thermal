name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0"'
      - name: Build, test and lint
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload development APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: quest-thermal-development-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
